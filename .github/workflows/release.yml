name: Release PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '智慧大全-20251210最新.pdf'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare asset with ASCII name
        run: cp "智慧大全-20251210最新.pdf" Become-Who-You-Are.pdf

      - name: Remove old asset to avoid duplication
        run: |
          for OLD in "zhihui-daquan.pdf" "-20251210.pdf"; do
            ID=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases" | \
              python3 -c "import json,sys; rs=json.load(sys.stdin); print(next((a['id'] for r in rs for a in r['assets'] if a['name']=='$OLD'), ''))")
            if [ -n "$ID" ]; then
              echo "Deleting old asset $OLD id=$ID"
              curl -s -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ID"
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Create release and upload PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0
          name: 《智慧大全》电子版 v1.0
          body: |
            《智慧大全——从认识自我到超越自我》全书电子版 PDF

            - 豆瓣页面：https://book.douban.com/subject/37424370/
          files: Become-Who-You-Are.pdf
